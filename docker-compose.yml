# EduMap — Development Docker Compose
# All data stores + services for local development
version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Data Stores ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: edumap-postgres
    environment:
      POSTGRES_USER: edumap
      POSTGRES_PASSWORD: edumap_dev
      POSTGRES_DB: edumap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumap"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  neo4j:
    image: neo4j:5-community
    container_name: edumap-neo4j
    environment:
      NEO4J_AUTH: neo4j/edumap_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.create.,apoc.merge.,apoc.coll.
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "edumap_dev", "RETURN 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: edumap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: edumap-chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8003:8000"
    volumes:
      - chroma-data:/chroma/data
    healthcheck:
      # Chroma 1.5.9 image has no curl/python — probe TCP readiness via bash
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # ─── Backend Services ─────────────────────────────────────────

  backend-core:
    build:
      context: .
      dockerfile: services/backend-core/Dockerfile
    container_name: edumap-backend-core
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: DEBUG
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: edumap_dev
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      API_KEY: ${API_KEY:-}
      SANDBOX_URL: http://sandbox-service:8002
      PROFILE_SERVICE_BASE: http://profile-service:8001
      DATABASE_URL: postgresql+asyncpg://edumap:edumap_dev@postgres:5432/edumap
      # Persist the sentence-transformers model cache across container recreations
      # (huggingface.co may be unreachable from inside the container)
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - hf-cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim image has no curl — use python like the Dockerfile
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    # Remove --reload + volume mount to eliminate WatchFiles CPU overhead
    # and slow host-filesystem Python imports. The container image already
    # contains the source code.
    logging: *default-logging

  profile-service:
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile
    container_name: edumap-profile-service
    ports:
      - "8001:8001"
    environment:
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql://edumap:edumap_dev@postgres:5432/edumap
      REDIS_URL: redis://redis:6379/1
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      API_KEY: ${API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/profile-service:/app
    logging: *default-logging

  sandbox-service:
    build:
      context: ./services/sandbox-service
      dockerfile: Dockerfile
    container_name: edumap-sandbox-service
    ports:
      - "8002:8002"
    environment:
      LOG_LEVEL: DEBUG
      API_KEY: ${API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload
    logging: *default-logging

  # ─── Frontend ─────────────────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: edumap-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend-core
      - profile-service
    command: pnpm dev
    # Volume mount removed because pnpm symlinks break across host→container
    # boundaries. The Docker image already contains source + node_modules.
    logging: *default-logging

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
  chroma-data:
  hf-cache:
