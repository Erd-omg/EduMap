name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 bandit
      - name: Lint Python services
        run: |
          # Settings (max-line-length, ignores, excludes) come from .flake8 at
          # the repo root so CI and local runs cannot drift.
          for service in services/backend-core services/profile-service services/sandbox-service; do
            echo "Linting $service..."
            flake8 "$service/src"
          done
      - name: SAST with bandit
        run: |
          for service in services/backend-core services/profile-service services/sandbox-service; do
            echo "Scanning $service with bandit..."
            bandit -r "$service/src" -ll -q || echo "Warning: bandit found issues in $service"
          done

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend-core dependencies
        run: |
          pip install -r services/backend-core/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
      - name: Run backend-core tests with coverage
        run: |
          cd services/backend-core
          python -m pytest tests/ -v --cov=src --cov-report=term --cov-fail-under=40
        # NOTE: ~825 tests at ~64% coverage.  pytest-timeout comes from
        # pytest.ini (timeout = 60): without it a stuck test stalls the whole
        # job with no output.  Keep the two lists in sync when adding plugins.

  integration-tests:
    runs-on: ubuntu-latest
    services:
      # NOTE: `ports` is required.  Service containers run on their own Docker
      # network; without publishing a port the job (which runs on the runner
      # host, not in that network) cannot reach them — the container reports
      # healthy and the client still gets ECONNREFUSED.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      chromadb:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edumap
          POSTGRES_PASSWORD: edumap_dev
          POSTGRES_DB: edumap
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for Neo4j to accept connections
        run: |
          # The container is marked healthy before Bolt is necessarily ready;
          # poll the actual port so the seed step doesn't race it.
          for i in $(seq 1 30); do
            if python -c "
          import socket, sys
          s = socket.socket(); s.settimeout(2)
          sys.exit(0 if s.connect_ex(('127.0.0.1', 7687)) == 0 else 1)
          "; then
              echo "Neo4j Bolt port is open"
              exit 0
            fi
            echo "waiting for neo4j bolt... ($i/30)"
            sleep 5
          done
          echo "Neo4j Bolt port never opened" >&2
          exit 1
      - name: Install dependencies
        run: |
          pip install -r services/backend-core/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx
      - name: Seed Neo4j test data
        run: |
          cd services/backend-core
          python -c "
          from src.kg.connection import Neo4jPool
          from src.kg.seed_loader import SeedLoader
          import asyncio
          async def seed():
              # 127.0.0.1 (not 'localhost'): on the runner 'localhost' resolves
              # to ::1 first, but the Neo4j service container only listens on
              # IPv4, so the connection is refused with Errno 111.
              pool = Neo4jPool('bolt://127.0.0.1:7687', '', '')
              loader = SeedLoader(pool)
              result = await loader.load_seed_data()
              print(f'Seeded: {result}')
              await pool.close()
          asyncio.run(seed())
          "
      - name: Run integration tests
        run: |
          cd services/backend-core
          # This job runs ONLY tests/test_api/ (78 tests) as a smoke test against
          # real Neo4j/Chroma/Postgres/Redis.  That subset structurally cannot
          # reach the full-suite 40% gate (it never touches rag/agents/memory —
          # measured ceiling ≈33%), so it uses its own lower floor.  The 40%
          # gate for the whole suite lives in the `python-tests` job.
          python -m pytest tests/test_api/ -v --cov=src --cov-report=term --cov-fail-under=30
        env:
          # 127.0.0.1 rather than 'localhost': on the runner, 'localhost'
          # prefers ::1 (IPv6) but the service containers listen on IPv4 only,
          # producing ConnectionRefusedError [Errno 111].
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: ""
          NEO4J_PASSWORD: ""
          CHROMA_HOST: 127.0.0.1
          CHROMA_PORT: "8000"
          DATABASE_URL: postgresql://edumap:edumap_dev@127.0.0.1:5432/edumap
          REDIS_URL: redis://127.0.0.1:6379/0

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm --filter web test:run

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Python dependencies
        run: |
          pip install pip-audit
          for req in services/backend-core/requirements.txt services/profile-service/requirements.txt services/sandbox-service/requirements.txt; do
            echo "Scanning $req..."
            pip-audit -r "$req" || echo "Warning: pip-audit found vulnerabilities in $req"
          done
