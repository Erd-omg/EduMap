[project]
name = "edumap-backend-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    # Durable graph state. The `postgres` extra brings psycopg; the `[binary]`
    # variant bundles libpq so no system PostgreSQL client library is required
    # (the project otherwise uses asyncpg, which is pure-Python on the wire and
    # needs nothing installed).
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "neo4j>=5.20.0",
    "chromadb>=0.5.20,<0.6.0",
    "sentence-transformers>=3.0.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "unstructured[pdf,docx,pptx]>=0.14.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
