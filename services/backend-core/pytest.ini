[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    asyncio: async tests

# Hang protection.  Without this a stuck test blocks the suite indefinitely and
# the only symptom is a silent stall — which is exactly how three
# model-loading hangs went unnoticed (see CLAUDE.md).  A timeout turns that
# into a stack dump naming the offending test.
#
# 60s is deliberately generous: the slowest legitimate tests are retry-backoff
# cases (~3s) and a ChromaDB test (~1.5s).  Raise per-test with
# @pytest.mark.timeout(N) if a genuinely slow case is ever added.
#
# timeout_func_only=false (the default) also covers fixture setup/teardown and
# collection-time imports — the model-loading hangs happened in conftest, not in
# a test body, so a body-only timeout would have missed them.
timeout = 60
timeout_method = thread
